name: TruffleHog Single Repo Scan

on:
  workflow_dispatch:

jobs:
  scan-single-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Run TruffleHog against target GitHub repo
        run: |
          docker run --rm \
            ghcr.io/trufflesecurity/trufflehog:latest \
            github \
            --repo=https://github.com/sshelat/Crazy_parser \
            --token=${{ secrets.TRUFFLEHOG_GITHUB_TOKEN }} \
            --results=verified \
            --json > trufflehog-results.json
        continue-on-error: true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
