name: TruffleHog All Repos Scan

on:
  workflow_dispatch:

jobs:
  scan-all-repos:
    runs-on: ubuntu-latest

    steps:
      - name: Run TruffleHog against all shashankshelat repos
        run: |
          docker run --rm \
            ghcr.io/trufflesecurity/trufflehog:latest \
            github \
            --org=shashankshelat \
            --token=${{ secrets.TRUFFLEHOG_GITHUB_TOKEN }} \
            --results=verified,unknown \
            --json > trufflehog-results.json

          echo "Result file size:"
          wc -c trufflehog-results.json

          echo "Preview:"
          head -n 20 trufflehog-results.json || true
        continue-on-error: true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
