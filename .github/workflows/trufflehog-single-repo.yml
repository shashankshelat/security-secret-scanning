name: TruffleHog Single Repo Scan

on:
  workflow_dispatch:

jobs:
  scan-single-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Clone target repo
        run: |
          git clone https://x-access-token:${{ secrets.TRUFFLEHOG_GITHUB_TOKEN_EAR }}@github.com/meetearnest/data-protection-proxy.git target-repo

      - name: Run TruffleHog on cloned repo
        run: |
          docker run --rm \
            -v "$PWD/target-repo:/repo" \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///repo \
            --results=verified,unknown \
            --json > trufflehog-results.json

          wc -c trufflehog-results.json
          head -n 20 trufflehog-results.json || true
        continue-on-error: true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json
